worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 0;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Deliberately omits host, URI, query, referrer, and user-agent.
    log_format orbit_redacted '$request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout orbit_redacted;

    limit_req_zone $binary_remote_addr zone=orbit_update_rate:1m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=orbit_update_connections:1m;

    server {
        listen 8080 default_server;
        server_name orbit-nav-updater.snap-it.cc;
        root /srv/orbit-updates;
        autoindex off;
        limit_conn orbit_update_connections 4;
        limit_req zone=orbit_update_rate burst=10 nodelay;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;

        if ($host != "orbit-nav-updater.snap-it.cc") {
            return 444;
        }

        # Reject raw dot-segment traversal before nginx's normalized location routing
        # can move a request between the independent channel roots.
        if ($request_uri ~* "(^|/)(\.|%2e){1,2}(/|%2f|$)") {
            return 400;
        }

        location = /healthz {
            access_log off;
            add_header Cache-Control "no-store" always;
            return 204;
        }

        location = /primary/manifest.json {
            limit_except GET { deny all; }
            try_files $uri =404;
            types { application/json json; }
            add_header Cache-Control "no-store, max-age=0" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
        }

        location ~ ^/primary/OrbitNavigator-[0-9]+\.[0-9]+\.[0-9]+\.exe$ {
            limit_except GET { deny all; }
            try_files $uri =404;
            types { application/vnd.microsoft.portable-executable exe; }
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
        }

        location = /beta/manifest.json {
            limit_except GET { deny all; }
            try_files $uri =404;
            types { application/json json; }
            add_header Cache-Control "no-store, max-age=0" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
        }

        location ~ ^/beta/OrbitNavigator-[0-9]+\.[0-9]+\.[0-9]+(?:-beta\.[0-9]+)?\.exe$ {
            limit_except GET { deny all; }
            try_files $uri =404;
            types { application/vnd.microsoft.portable-executable exe; }
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
        }

        location / {
            return 404;
        }
    }
}
